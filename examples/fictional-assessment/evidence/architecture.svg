<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430" role="img" aria-labelledby="title desc">
  <title id="title">Fictional assessment architecture</title>
  <desc id="desc">An assessor connects through the internet to a public application. The application connects to a protected administration service.</desc>
  <defs>
    <linearGradient id="panel" x1="0" x2="1">
      <stop offset="0" stop-color="#07182f"/>
      <stop offset="1" stop-color="#102a50"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#00b8d9"/>
    </marker>
  </defs>
  <rect width="1100" height="430" rx="24" fill="#f5f8fc"/>
  <rect x="55" y="120" width="240" height="180" rx="18" fill="url(#panel)"/>
  <rect x="430" y="120" width="240" height="180" rx="18" fill="url(#panel)"/>
  <rect x="805" y="120" width="240" height="180" rx="18" fill="url(#panel)"/>
  <path d="M 295 210 L 420 210" stroke="#00b8d9" stroke-width="6" marker-end="url(#arrow)"/>
  <path d="M 670 210 L 795 210" stroke="#00b8d9" stroke-width="6" marker-end="url(#arrow)"/>
  <text x="175" y="190" text-anchor="middle" fill="#fff" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="700">Assessor</text>
  <text x="175" y="235" text-anchor="middle" fill="#bde9f5" font-family="DejaVu Sans, sans-serif" font-size="21">Authorized testing</text>
  <text x="550" y="175" text-anchor="middle" fill="#fff" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="700">Public application</text>
  <text x="550" y="220" text-anchor="middle" fill="#bde9f5" font-family="DejaVu Sans, sans-serif" font-size="20">support.demo.invalid</text>
  <text x="550" y="255" text-anchor="middle" fill="#bde9f5" font-family="DejaVu Sans, sans-serif" font-size="18">Assessment scope</text>
  <text x="925" y="175" text-anchor="middle" fill="#fff" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="700">Administration</text>
  <text x="925" y="220" text-anchor="middle" fill="#bde9f5" font-family="DejaVu Sans, sans-serif" font-size="20">Restricted service</text>
  <text x="925" y="255" text-anchor="middle" fill="#bde9f5" font-family="DejaVu Sans, sans-serif" font-size="18">Management boundary</text>
  <text x="355" y="190" text-anchor="middle" fill="#465166" font-family="DejaVu Sans, sans-serif" font-size="18">Internet</text>
  <text x="735" y="190" text-anchor="middle" fill="#465166" font-family="DejaVu Sans, sans-serif" font-size="18">Trust boundary</text>
</svg>
