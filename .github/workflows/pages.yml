name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Install document toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes pandoc weasyprint python3-yaml
      - name: Build example report
        run: ./scripts/reportkit build examples/fictional-assessment
      - name: Assemble site
        run: |
          mkdir -p _site/downloads
          cp -a site/. _site/
          cp examples/fictional-assessment/_build/northstar-security-assessment.pdf _site/downloads/
          cp examples/fictional-assessment/_build/northstar-security-assessment.html _site/downloads/
          touch _site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
